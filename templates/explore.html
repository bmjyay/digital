<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explore New Haven — IMC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
</head>

<body>
  <nav class="nav">
    <a href="{{ url_for('portal') }}" class="nav__brand">
      <svg class="nav__logo" viewBox="0 0 120 120" role="img" aria-label="Ivy Muslim Conference">
        <circle cx="60" cy="60" r="58" class="nav__logo-bg" />
        <path d="M30 24 H52 V27 H47 L60.5 48 L76 27 H71 V24 H90 V27 H84 L65 57 V80 H72 V84 H48 V80 H55 V57 L35 27 H30 Z" transform="translate(0 6)" class="nav__logo-y" />
      </svg>
      <span class="nav__brand-text">Ivy Muslim Conference @ Yale</span>
    </a>

    {% include "_nav_links.html" %}

    <div class="nav__spacer"></div>

    <a class="nav__link" href="{{ url_for('admin_login') }}">Admin Panel</a>
  </nav>

  <div class="waves" aria-hidden="true">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <main class="page">
    <header class="card card--hero page-header">
      <p class="section-eyebrow">New Haven · Recommendations</p>
      <h1 class="section-heading">Explore New Haven</h1>
      <p class="hint">Cafes, restaurants and things to do, recommended by your IMC community.</p>
    </header>

    <section class="page-body">
      <div id="explore-filters" class="filter-pills" role="tablist" aria-label="Filter by category"></div>
      <div id="explore-grid" class="place-grid reveal" aria-live="polite"></div>
      <p id="explore-empty" class="empty-state" hidden>No recommendations yet. Check back soon.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__left">
        <strong>Ivy Muslim Conference @ Yale</strong>
        <span class="footer__muted">· Explore New Haven</span>
      </div>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/site.js') }}"></script>
  <script src="{{ url_for('static', filename='js/explore.js') }}"></script>
</body>
</html>
